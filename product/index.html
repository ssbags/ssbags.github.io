<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MsnCloud Image Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); }
        .img-card:hover .overlay { opacity: 1; }
        .transition-custom { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen selection:bg-blue-500/30">

    <nav class="sticky top-0 z-50 glass border-b border-slate-800 px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-2.5 rounded-xl shadow-lg shadow-blue-500/20">
                    <i class="fas fa-cloud-upload-alt text-white text-xl"></i>
                </div>
                <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white">
                    MsnCloud <span class="text-blue-500">Image Engine</span>
                </h1>
            </div>
            <div id="auth-section">
                <!-- Login/Logout button will appear here -->
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 md:p-10">
        
        <div id="admin-panel" class="hidden mb-12 bg-slate-900/40 border border-slate-800 rounded-[2rem] p-8 shadow-2xl">
            <div class="flex items-center gap-3 mb-6">
                <div class="h-3 w-3 bg-green-500 rounded-full animate-pulse"></div>
                <h2 class="text-lg font-bold text-slate-100">অ্যাডমিন কন্ট্রোল প্যানেল</h2>
            </div>
            
            <div class="flex flex-col md:flex-row gap-8 items-center">
                <div class="w-full md:w-2/3">
                    <label class="group relative flex flex-col items-center justify-center w-full h-44 border-2 border-slate-700 border-dashed rounded-2xl cursor-pointer bg-slate-900/50 hover:bg-slate-900 hover:border-blue-500 transition-custom">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <i class="fas fa-cloud-upload-alt text-slate-500 text-4xl mb-4 group-hover:text-blue-500 transition-custom"></i>
                            <p class="text-sm text-slate-400 font-semibold">নতুন ছবি আপলোড করতে এখানে ক্লিক করুন</p>
                            <p class="text-xs text-slate-500 mt-2">৫ এমবি লিমিট | bag41, bag42 সিরিয়াল অটোমেটিক হবে</p>
                        </div>
                        <input type="file" id="image-upload" class="hidden" accept="image/*" />
                    </label>
                </div>
                <div id="upload-status" class="hidden w-full md:w-1/3 p-6 bg-slate-950 rounded-2xl border border-slate-800 text-center">
                    <div class="inline-block animate-spin text-blue-500 text-3xl mb-3"><i class="fas fa-circle-notch"></i></div>
                    <p class="text-sm font-medium">প্রসেসিং ও আপলোড হচ্ছে...</p>
                </div>
            </div>
        </div>

        <div class="mb-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h3 class="text-2xl font-bold text-white mb-1">ফাইল লাইব্রেরি</h3>
                <p id="image-count" class="text-slate-500 text-sm">ডেটা লোড হচ্ছে...</p>
            </div>
            <div id="permission-error-alert" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-2 rounded-lg text-xs">
                <i class="fas fa-exclamation-triangle mr-2"></i> পারমিশন এরর! ফায়ারবেস রুলস চেক করুন।
            </div>
        </div>

        <div id="image-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-8">
            <!-- Images will be injected here -->
        </div>

        <div id="empty-state" class="hidden py-40 text-center">
            <div class="bg-slate-900 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-images text-slate-700 text-3xl"></i>
            </div>
            <p class="text-slate-500 text-lg">এখনো কোনো ইমেজ আপলোড করা হয়নি!</p>
        </div>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/90 backdrop-blur-md p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-[2rem] p-10 shadow-2xl relative">
            <button onclick="closeModal('login-modal')" class="absolute top-6 right-6 text-slate-500 hover:text-white transition">
                <i class="fas fa-times"></i>
            </button>
            <div class="text-center mb-8">
                <div class="bg-blue-600/10 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-blue-500 text-2xl">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">অ্যাডমিন লগইন</h2>
            </div>
            <div class="space-y-4">
                <input type="password" id="admin-pass" placeholder="পাসওয়ার্ড লিখুন (123)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 focus:outline-none focus:border-blue-500 transition text-center tracking-widest text-white">
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition shadow-lg active:scale-95">
                    লগইন করুন
                </button>
            </div>
        </div>
    </div>

    <!-- Zoom Modal -->
    <div id="zoom-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/95 p-4" onclick="closeModal('zoom-modal')">
        <button class="absolute top-8 right-8 text-white text-3xl hover:text-slate-400 transition z-[110]">
            <i class="fas fa-times"></i>
        </button>
        <img id="zoomed-img" src="" class="max-w-full max-h-[90vh] rounded-xl shadow-2xl object-contain animate-in zoom-in duration-300" onclick="event.stopPropagation()">
    </div>

    <!-- Rename Modal -->
    <div id="rename-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-[2rem] p-8 relative">
            <button onclick="closeModal('rename-modal')" class="absolute top-6 right-6 text-slate-500 hover:text-white transition">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="text-xl font-bold mb-6 text-white">ইমেজ রিনেম</h2>
            <div class="space-y-4">
                <input type="hidden" id="rename-id">
                <input type="text" id="new-name-input" placeholder="নতুন নাম লিখুন" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 focus:outline-none focus:border-blue-500 transition text-white">
                <button onclick="handleRename()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition shadow-lg">
                    রিনেম আপডেট করুন
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-8 py-3 rounded-full font-bold shadow-2xl opacity-0 invisible transition-all duration-300 z-[200]">
        <i class="fas fa-check-circle mr-2"></i> লিংক কপি করা হয়েছে!
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'msn-image-engine';

        let imagesList = [];
        let isAdmin = false;

        const init = async () => {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        renderUI();
                        listenToData();
                    }
                });
            } catch (err) {
                console.error("Auth Error:", err);
            }
        };

        const listenToData = () => {
            const imagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'images');
            onSnapshot(imagesRef, (snapshot) => {
                document.getElementById('permission-error-alert').classList.add('hidden');
                imagesList = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                imagesList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderGallery();
            }, (error) => {
                if(error.code === 'permission-denied') {
                    document.getElementById('permission-error-alert').classList.remove('hidden');
                }
            });
        };

        const renderUI = () => {
            const authSection = document.getElementById('auth-section');
            const adminPanel = document.getElementById('admin-panel');

            if (isAdmin) {
                authSection.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="bg-blue-500/10 text-blue-400 px-3 py-1 rounded-full text-xs font-bold border border-blue-500/20 uppercase tracking-tighter">Admin Active</span>
                        <button onclick="window.logout()" class="bg-red-500/10 hover:bg-red-500 hover:text-white text-red-500 p-2.5 rounded-xl transition-custom border border-red-500/20">
                            <i class="fas fa-power-off"></i>
                        </button>
                    </div>
                `;
                adminPanel.classList.remove('hidden');
            } else {
                authSection.innerHTML = `
                    <button onclick="window.openModal('login-modal')" class="bg-slate-800 hover:bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-custom border border-slate-700 hover:border-blue-500">
                        <i class="fas fa-lock mr-2"></i> অ্যাডমিন লগইন
                    </button>
                `;
                adminPanel.classList.add('hidden');
            }
            renderGallery();
        };

        const renderGallery = () => {
            const grid = document.getElementById('image-grid');
            const emptyState = document.getElementById('empty-state');
            const countLabel = document.getElementById('image-count');

            grid.innerHTML = '';
            countLabel.innerText = `মোট আপলোডকৃত ইমেজ: ${imagesList.length} টি`;

            if (imagesList.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            imagesList.forEach(img => {
                const card = document.createElement('div');
                card.className = 'img-card bg-slate-900 border border-slate-800 rounded-[1.5rem] overflow-hidden shadow-lg hover:shadow-blue-500/5 hover:border-slate-700 transition-custom group';
                card.innerHTML = `
                    <div class="relative aspect-square overflow-hidden bg-slate-950">
                        <img src="${img.url}" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110 cursor-zoom-in" onclick="window.zoomImage('${img.url}')">
                        <div class="overlay absolute inset-0 bg-slate-950/60 opacity-0 transition-custom flex items-center justify-center gap-3 p-4">
                            <button onclick="window.zoomImage('${img.url}')" class="bg-white/10 backdrop-blur-md p-4 rounded-full hover:bg-white/20 text-white transition-custom translate-y-4 group-hover:translate-y-0">
                                <i class="fas fa-expand-alt"></i>
                            </button>
                            <a href="${img.url}" target="_blank" download class="bg-white/10 backdrop-blur-md p-4 rounded-full hover:bg-white/20 text-white transition-custom translate-y-4 group-hover:translate-y-0 delay-75">
                                <i class="fas fa-download"></i>
                            </a>
                        </div>
                    </div>
                    <div class="p-5">
                        <p class="text-sm font-mono text-slate-400 truncate mb-4" title="${img.name}">${img.name}</p>
                        <button onclick="window.copyLink('${img.url}')" class="w-full bg-slate-800 hover:bg-blue-600 py-3 rounded-xl text-xs font-bold transition-custom flex items-center justify-center gap-2 border border-slate-700 hover:border-blue-500">
                            <i class="fas fa-link"></i> ডিরেক্ট ইউআরএল কপি
                        </button>
                        ${isAdmin ? `
                            <div class="mt-4 pt-4 border-t border-slate-800 flex justify-between">
                                <button onclick="window.openRenameModal('${img.id}', '${img.name}')" class="text-amber-500 hover:text-amber-400 text-xs font-bold flex items-center gap-1 transition-custom">
                                    <i class="fas fa-edit"></i> রিনেম
                                </button>
                                <button onclick="window.handleDelete('${img.id}', '${img.storagePath}')" class="text-red-500 hover:text-red-400 text-xs font-bold flex items-center gap-1 transition-custom">
                                    <i class="fas fa-trash-alt"></i> ডিলিট
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        const getNextBagName = () => {
            const bagFiles = imagesList.filter(img => img.name.toLowerCase().startsWith('bag'));
            let maxNum = 40; 
            bagFiles.forEach(img => {
                const match = img.name.match(/bag(\d+)/i);
                if (match) {
                    const num = parseInt(match[1]);
                    if (num > maxNum) maxNum = num;
                }
            });
            return `bag${maxNum + 1}`;
        };

        document.getElementById('image-upload').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert("সাইজ ৫ এমবি-র বেশি হওয়া যাবে না!");
                return;
            }

            const status = document.getElementById('upload-status');
            status.classList.remove('hidden');

            try {
                const ext = file.name.split('.').pop();
                const newName = getNextBagName() + "." + ext;
                const storagePath = `artifacts/${appId}/images/${Date.now()}_${newName}`;
                const storageRef = ref(storage, storagePath);

                await uploadBytes(storageRef, file);
                const downloadURL = await getDownloadURL(storageRef);

                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'images'), {
                    name: newName,
                    url: downloadURL,
                    storagePath: storagePath,
                    createdAt: Date.now()
                });
            } catch (err) {
                console.error("Upload Error:", err);
                alert("পারমিশন এরর: অনুগ্রহ করে ফায়ারবেস রুলস চেক করুন।");
            } finally {
                status.classList.add('hidden');
                e.target.value = '';
            }
        };

        window.openModal = (id) => {
            const m = document.getElementById(id);
            m.classList.remove('hidden');
            m.classList.add('flex');
        };

        window.closeModal = (id) => {
            const m = document.getElementById(id);
            m.classList.add('hidden');
            m.classList.remove('flex');
        };

        window.handleLogin = () => {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "123") {
                isAdmin = true;
                window.closeModal('login-modal');
                document.getElementById('admin-pass').value = '';
                renderUI();
            } else {
                alert("ভুল পাসওয়ার্ড!");
            }
        };

        window.logout = () => {
            isAdmin = false;
            renderUI();
        };

        window.zoomImage = (src) => {
            document.getElementById('zoomed-img').src = src;
            window.openModal('zoom-modal');
        };

        window.copyLink = (url) => {
            const el = document.createElement('textarea');
            el.value = url;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'invisible');
            toast.classList.add('opacity-100', 'visible');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'invisible');
            }, 2500);
        };

        window.openRenameModal = (id, currentName) => {
            const pureName = currentName.split('.').slice(0, -1).join('.');
            document.getElementById('rename-id').value = id;
            document.getElementById('new-name-input').value = pureName;
            window.openModal('rename-modal');
        };

        window.handleRename = async () => {
            const id = document.getElementById('rename-id').value;
            const newNameRaw = document.getElementById('new-name-input').value.replace(/\s+/g, '');
            if (!newNameRaw) return;

            const image = imagesList.find(i => i.id === id);
            const ext = image.name.split('.').pop();
            const finalName = newNameRaw + "." + ext;

            try {
                const imgRef = doc(db, 'artifacts', appId, 'public', 'data', 'images', id);
                await updateDoc(imgRef, { name: finalName });
                window.closeModal('rename-modal');
            } catch (err) {
                alert("পারমিশন এরর!");
            }
        };

        window.handleDelete = async (id, storagePath) => {
            if (!confirm("মুছে ফেলতে চান?")) return;
            try {
                await deleteObject(ref(storage, storagePath));
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'images', id));
            } catch (err) {
                alert("মুছে ফেলা সম্ভব হয়নি।");
            }
        };

        init();
    </script>
</body>
</html>
