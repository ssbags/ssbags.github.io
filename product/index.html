<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MsnCloud Image Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0f172a; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
        .img-card:hover .overlay { opacity: 1; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-200 min-h-screen">

    <!-- নেভিগেশন বার -->
    <nav class="sticky top-0 z-50 glass border-b border-slate-700 px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fas fa-cloud-upload-alt text-blue-500 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-tight">MsnCloud Image Engine</h1>
            </div>
            <div id="auth-controls">
                <!-- ডাইনামিক বাটন -->
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        
        <!-- অ্যাডমিন কন্ট্রোল (লগইন থাকলে দেখাবে) -->
        <div id="admin-area" class="hidden mb-10 bg-slate-800/50 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <h2 class="text-blue-400 font-bold mb-4 flex items-center gap-2">
                <i class="fas fa-tools"></i> অ্যাডমিন প্যানেল
            </h2>
            <div class="flex flex-col md:flex-row gap-4 items-center">
                <label class="flex-1 flex flex-col items-center justify-center w-full h-32 border-2 border-slate-600 border-dashed rounded-xl cursor-pointer hover:bg-slate-800 transition">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <i class="fas fa-image text-slate-500 text-2xl mb-2"></i>
                        <p class="text-sm text-slate-400">নতুন ইমেজ সিলেক্ট করুন (সর্বোচ্চ ৫ এমবি)</p>
                    </div>
                    <input type="file" id="file-input" class="hidden" accept="image/*" />
                </label>
                <div id="upload-progress" class="hidden text-center p-4">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-10 w-10 mx-auto mb-2"></div>
                    <p class="text-xs">আপলোড হচ্ছে...</p>
                </div>
            </div>
        </div>

        <!-- ইমেজ গ্যালারি -->
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-lg font-semibold text-slate-400"><i class="fas fa-images mr-2"></i> গ্যালারি</h3>
            <div id="status-text" class="text-xs text-slate-500 italic">ডেটা লোড হচ্ছে...</div>
        </div>

        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
            <!-- ইমেজ কার্ডগুলো এখানে আসবে -->
        </div>

        <!-- এম্পটি স্টেট -->
        <div id="no-images" class="hidden py-20 text-center text-slate-600">
            <i class="fas fa-folder-open text-6xl mb-4 opacity-20"></i>
            <p>কোন ইমেজ পাওয়া যায়নি। অ্যাডমিন হিসেবে লগইন করে আপলোড করুন।</p>
        </div>
    </main>

    <!-- লগইন মডাল -->
    <div id="login-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-8 shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-center">অ্যাডমিন লগইন</h2>
            <input type="password" id="pass-input" placeholder="পাসওয়ার্ড লিখুন" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 mb-4 outline-none focus:border-blue-500 transition text-center">
            <div class="flex gap-2">
                <button onclick="closeModal('login-modal')" class="flex-1 bg-slate-700 py-3 rounded-xl font-bold">বাতিল</button>
                <button onclick="checkLogin()" class="flex-1 bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-700">লগইন</button>
            </div>
        </div>
    </div>

    <!-- জুম মডাল -->
    <div id="zoom-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/95 p-4" onclick="closeModal('zoom-modal')">
        <img id="zoomed-img" src="" class="max-w-full max-h-screen rounded-lg shadow-2xl object-contain">
    </div>

    <!-- রিনেম মডাল -->
    <div id="rename-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-8 relative">
            <h2 class="text-xl font-bold mb-4">ইমেজ রিনেম</h2>
            <input type="hidden" id="rename-id">
            <input type="text" id="new-name-input" placeholder="নতুন নাম (স্পেস ছাড়া)" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 mb-4 outline-none focus:border-blue-500">
            <div class="flex gap-2">
                <button onclick="closeModal('rename-modal')" class="flex-1 bg-slate-700 py-3 rounded-xl font-bold">বাতিল</button>
                <button onclick="confirmRename()" class="flex-1 bg-yellow-600 py-3 rounded-xl font-bold hover:bg-yellow-700 text-black">আপডেট</button>
            </div>
        </div>
    </div>

    <!-- টোস্ট নোটিফিকেশন -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-2xl opacity-0 transition-opacity pointer-events-none">লিংক কপি হয়েছে!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // কনফিগারেশন
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'msn-cloud-engine';

        let user = null;
        let isAdmin = false;
        let imagesData = [];

        // ১. অটো লগইন এবং ডেটা লিসেনার
        const init = async () => {
            const initAuth = async () => {
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await signInAnonymously(auth);
              }
            };
            await initAuth();
            
            onAuthStateChanged(auth, (u) => {
                user = u;
                if(user) fetchImages();
                renderAuthUI();
            });
        };

        const fetchImages = () => {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'images');
            onSnapshot(q, (snapshot) => {
                imagesData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                imagesData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                renderGallery();
            }, (err) => {
                console.error("Firestore Error:", err);
                document.getElementById('status-text').innerText = "ডেটা লোড করতে সমস্যা হচ্ছে।";
            });
        };

        // ২. ইউআই রেন্ডারিং
        const renderAuthUI = () => {
            const container = document.getElementById('auth-controls');
            if(isAdmin) {
                container.innerHTML = `<button id="logout-btn" class="text-red-500 font-bold text-sm bg-red-500/10 px-4 py-2 rounded-lg border border-red-500/20">লগআউট</button>`;
                document.getElementById('admin-area').classList.remove('hidden');
                document.getElementById('logout-btn').onclick = window.logout;
            } else {
                container.innerHTML = `<button onclick="window.openModal('login-modal')" class="bg-blue-600 text-white font-bold text-sm px-4 py-2 rounded-lg">অ্যাডমিন লগইন</button>`;
                document.getElementById('admin-area').classList.add('hidden');
            }
        };

        const renderGallery = () => {
            const grid = document.getElementById('gallery-grid');
            const empty = document.getElementById('no-images');
            grid.innerHTML = '';
            
            document.getElementById('status-text').innerText = `মোট ইমেজ: ${imagesData.length}`;

            if(imagesData.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            imagesData.forEach(img => {
                const card = document.createElement('div');
                card.className = "img-card bg-slate-800 border border-slate-700 rounded-xl overflow-hidden group shadow-lg";
                card.innerHTML = `
                    <div class="aspect-square bg-slate-950 relative overflow-hidden">
                        <img src="${img.url}" class="w-full h-full object-cover cursor-zoom-in transition duration-500 group-hover:scale-110" onclick="window.zoomImage('${img.url}')">
                    </div>
                    <div class="p-4">
                        <p class="text-xs text-slate-400 truncate mb-3" title="${img.name}">${img.name}</p>
                        <div class="flex flex-col gap-2">
                            <button onclick="window.copyToClipboard('${img.url}')" class="w-full bg-slate-700 hover:bg-blue-600 py-2 rounded text-[10px] font-bold transition">
                                <i class="fas fa-link mr-1"></i> কপি ডিরেক্ট লিংক
                            </button>
                            <a href="${img.url}" download target="_blank" class="w-full bg-slate-700 hover:bg-slate-600 py-2 rounded text-[10px] font-bold transition text-center">
                                <i class="fas fa-download mr-1"></i> ডাউনলোড
                            </a>
                        </div>
                        ${isAdmin ? `
                        <div class="mt-3 pt-3 border-t border-slate-700 flex justify-between">
                            <button onclick="window.openRenameModal('${img.id}', '${img.name}')" class="text-yellow-500 hover:text-yellow-400 text-[10px] font-bold">রিনেম</button>
                            <button onclick="window.deleteImage('${img.id}', '${img.storagePath}')" class="text-red-500 hover:text-red-400 text-[10px] font-bold">ডিলিট</button>
                        </div>
                        ` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        // ৩. ইমেজ নেমিং লজিক (bag41, bag42...)
        const getNextBagName = () => {
            const bagFiles = imagesData.filter(i => i.name && i.name.startsWith('bag'));
            let maxNum = 40;
            bagFiles.forEach(i => {
                const match = i.name.match(/bag(\d+)/i);
                if(match) {
                    const num = parseInt(match[1]);
                    if(num > maxNum) maxNum = num;
                }
            });
            return `bag${maxNum + 1}`;
        };

        // ৪. আপলোড লজিক
        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            if(file.size > 5 * 1024 * 1024) {
                alert("৫ এমবি-র বড় ফাইল আপলোড করা যাবে না!");
                return;
            }

            const loader = document.getElementById('upload-progress');
            loader.classList.remove('hidden');

            try {
                const ext = file.name.split('.').pop();
                const newName = getNextBagName() + "." + ext;
                const path = `artifacts/${appId}/images/${Date.now()}_${newName}`;
                const sRef = ref(storage, path);
                
                await uploadBytes(sRef, file);
                const url = await getDownloadURL(sRef);

                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'images'), {
                    name: newName,
                    url: url,
                    storagePath: path,
                    timestamp: Date.now()
                });
            } catch (err) {
                console.error("Upload failed", err);
                alert("আপলোড ব্যর্থ হয়েছে।");
            } finally {
                loader.classList.add('hidden');
                e.target.value = '';
            }
        };

        // ৫. গ্লোবাল ফাংশনসমূহ
        window.openModal = (id) => {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
        };

        window.closeModal = (id) => {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        };

        window.checkLogin = () => {
            const pass = document.getElementById('pass-input').value;
            if(pass === "123") {
                isAdmin = true;
                window.closeModal('login-modal');
                document.getElementById('pass-input').value = '';
                renderAuthUI();
                renderGallery();
            } else {
                alert("ভুল পাসওয়ার্ড!");
            }
        };

        window.logout = () => {
            isAdmin = false;
            renderAuthUI();
            renderGallery();
        };

        window.zoomImage = (src) => {
            document.getElementById('zoomed-img').src = src;
            window.openModal('zoom-modal');
        };

        window.copyToClipboard = (url) => {
            const el = document.createElement('textarea');
            el.value = url;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const t = document.getElementById('toast');
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 2000);
        };

        window.openRenameModal = (id, currentName) => {
            const nameOnly = currentName.split('.').slice(0, -1).join('.');
            document.getElementById('rename-id').value = id;
            document.getElementById('new-name-input').value = nameOnly;
            window.openModal('rename-modal');
        };

        window.confirmRename = async () => {
            const id = document.getElementById('rename-id').value;
            const newName = document.getElementById('new-name-input').value.replace(/\s+/g, '');
            if(!newName) return;

            const imageObj = imagesData.find(i => i.id === id);
            if (!imageObj) return;
            const ext = imageObj.name.split('.').pop();
            
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'images', id);
                await updateDoc(docRef, { name: newName + "." + ext });
                window.closeModal('rename-modal');
            } catch (err) {
                alert("রিনেম ব্যর্থ হয়েছে।");
            }
        };

        window.deleteImage = async (id, path) => {
            if(!confirm("আপনি কি নিশ্চিতভাবে মুছে ফেলতে চান?")) return;
            try {
                const storageRef = ref(storage, path);
                await deleteObject(storageRef);
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'images', id);
                await deleteDoc(docRef);
            } catch (err) {
                console.error("Delete failed", err);
                alert("ডিলিট করতে সমস্যা হয়েছে।");
            }
        };

        init();
    </script>
</body>
</html>
